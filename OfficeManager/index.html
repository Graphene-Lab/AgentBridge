<!DOCTYPE html>
<html lang="en" translate="no">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="google" content="notranslate">
<title>Office Manager 16-Bit</title>
<link rel="stylesheet" href="/OfficeManager/style.css">
</head>
<body>
<div id="app">
  <div id="gamebox">
    <div id="stage">
      <canvas id="game" width="1024" height="683"></canvas>
    </div>
    <div id="chat">
      <div id="log" aria-live="polite"></div>
      <div id="inputrow">
        <span class="prompt">&gt;</span>
        <input id="input" type="text" maxlength="80" autocomplete="off" spellcheck="false" autofocus aria-label="chat input">
        <span class="hint">tab = hire · esc = release/close · enter = talk</span>
        <button id="snd" type="button" title="toggle sound">SOUND:ON</button>
      </div>
    </div>
  </div>
</div>

<!-- side roster: the employees that currently have a task, with completion bars (issue #30) -->
<div id="roster" class="empty" aria-label="employees on the job">
  <div class="rhead">ON THE JOB</div>
  <div id="rosterlist"></div>
</div>

<!-- per-employee answer window: what the employee needs + a field to reply (issue #30) -->
<div id="askbox" role="dialog" aria-modal="true" aria-labelledby="askname">
  <div class="askpanel">
    <div class="askhead">
      <span id="askname">employee</span>
      <button id="askclose" type="button" title="close">&times;</button>
    </div>
    <div id="askmsg" class="askmsg"></div>
    <div class="askrow">
      <input id="askinput" type="text" maxlength="500" autocomplete="off" spellcheck="false" aria-label="answer">
      <button id="asksend" type="button">SEND</button>
    </div>
  </div>
</div>
<script src="/OfficeManager/assets/office-mask.js"></script>
<script src="/OfficeManager/game.js"></script>
</body>
</html>
