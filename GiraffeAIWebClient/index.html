<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1.0">
    <title>Giraffe AI</title>
    <meta name="theme-color" content="#6c5ce7">
    <link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⚡</text></svg>">
    <style>
        :root {
            --bg: #0a0a0f;
            --surface: #13131c;
            --surface2: #1a1a28;
            --surface3: #222236;
            --text: #e0e0f0;
            --text2: #a0a0c0;
            --accent: #6c5ce7;
            --accent2: #a29bfe;
            --accent3: #00d2ff;
            --glow: #6c5ce766;
            --danger: #e74c3c;
            --success: #2ecc71;
            --warning: #f39c12;
            --border: #2a2a40;
            --radius: 16px;
            --radius-sm: 10px;
            --radius-xs: 6px;
            --shadow: 0 8px 40px rgba(0,0,0,0.5);
            --transition: 0.25s cubic-bezier(0.4,0,0.2,1);
            --font: 'Segoe UI', system-ui, -apple-system, sans-serif;
            --mono: 'Cascadia Code', 'JetBrains Mono', 'Fira Code', 'Consolas', monospace;
        }
        body.light-mode {
            --bg: #f5f5f9;
            --surface: #fff;
            --surface2: #f0f0f5;
            --surface3: #e8e8f0;
            --text: #1a1a2e;
            --text2: #5a5a7a;
            --accent: #5a4fcf;
            --accent2: #4a3db5;
            --accent3: #0088cc;
            --glow: #6c5ce740;
            --danger: #c0392b;
            --success: #27ae60;
            --border: #d0d0e0;
            --shadow: 0 8px 40px rgba(0,0,0,0.1);
        }
        *{margin:0;padding:0;box-sizing:border-box}
        body,html{height:100%;font-family:var(--font);background:var(--bg);color:var(--text);overflow:hidden;-webkit-font-smoothing:antialiased}
        .bg-orbs{position:fixed;inset:0;pointer-events:none;z-index:0}
        .bg-orb{position:absolute;border-radius:50%;filter:blur(120px);opacity:.12;animation:orbFloat 18s ease-in-out infinite}
        .bg-orb:nth-child(1){width:500px;height:500px;background:#6c5ce7;top:-15%;left:-10%;animation-delay:0s}
        .bg-orb:nth-child(2){width:400px;height:400px;background:#00d2ff;bottom:-20%;right:-8%;animation-delay:-6s;animation-duration:20s}
        .bg-orb:nth-child(3){width:350px;height:350px;background:#a29bfe;top:40%;left:50%;animation-delay:-12s;animation-duration:22s}
        @keyframes orbFloat{0%,100%{transform:translate(0,0) scale(1)}25%{transform:translate(8%,-5%) scale(1.15)}50%{transform:translate(-3%,7%) scale(.9)}75%{transform:translate(-6%,-3%) scale(1.08)}}
        .grid-overlay{position:fixed;inset:0;pointer-events:none;z-index:0;opacity:.03;background-image:linear-gradient(rgba(255,255,255,.5) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.5) 1px,transparent 1px);background-size:50px 50px}
        body.light-mode .grid-overlay{opacity:.06;background-image:linear-gradient(rgba(0,0,0,.08) 1px,transparent 1px),linear-gradient(90deg,rgba(0,0,0,.08) 1px,transparent 1px)}
        .app-container{position:relative;z-index:1;display:flex;height:100vh;width:100%}
        .sidebar{width:300px;min-width:300px;background:var(--surface);border-right:1px solid var(--border);display:flex;flex-direction:column;transition:var(--transition);z-index:10;position:relative}
        .sidebar.collapsed{min-width:0;width:0;overflow:hidden;border-right:none}
        .sidebar-header{padding:16px 18px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;gap:10px}
        .sidebar-header .logo{display:flex;align-items:center;gap:8px;font-weight:700;font-size:1.2em;background:linear-gradient(135deg,var(--accent2),var(--accent3));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;white-space:nowrap}
        .sidebar-content{flex:1;overflow-y:auto;padding:10px 12px;display:flex;flex-direction:column;gap:6px;position:relative}
        .sidebar-mascot{position:absolute;bottom:0;left:0;width:100%;height:180px;display:flex;justify-content:center;overflow:hidden;pointer-events:none;opacity:.5;z-index:-1;color:var(--text2)}
        .sidebar-mascot svg{height:100%;width:auto;display:block}
        .sidebar-mascot path{fill:currentColor}
        .sidebar-content::-webkit-scrollbar{width:4px}
        .sidebar-content::-webkit-scrollbar-thumb{background:var(--border);border-radius:4px}
        .btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;padding:10px 16px;border-radius:var(--radius-xs);border:1px solid var(--border);background:var(--surface2);color:var(--text);cursor:pointer;font-size:.9em;font-family:var(--font);transition:var(--transition);white-space:nowrap;outline:0;user-select:none}
        .btn:hover{background:var(--surface3);border-color:var(--accent);box-shadow:0 0 20px var(--glow)}
        .btn:active{transform:scale(.97)}
        .btn-accent{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
        .btn-accent:hover{background:#7d6ff0;box-shadow:0 0 30px var(--glow)}
        .btn-sm{padding:6px 10px;font-size:.78em;border-radius:4px}
        .btn-icon{width:36px;height:36px;padding:0;border-radius:50%;border:1px solid var(--border);background:var(--surface2);color:var(--text);cursor:pointer;transition:var(--transition);display:inline-flex;align-items:center;justify-content:center}
        .btn-icon:hover{background:var(--surface3);border-color:var(--accent);box-shadow:0 0 16px var(--glow)}
        .btn-danger{border-color:var(--danger);color:var(--danger);background:0 0}
        .btn-danger:hover{background:#e74c3c22;border-color:#e74c3c;box-shadow:0 0 20px #e74c3c44}
        .provider-item{display:flex;align-items:center;gap:10px;padding:11px 14px;border-radius:var(--radius-sm);cursor:pointer;transition:var(--transition);border:1px solid transparent;background:var(--surface2);position:relative}
        .provider-item:hover{border-color:var(--border);background:var(--surface3)}
        .provider-item.active{border-color:var(--accent)!important;background:var(--surface3);box-shadow:0 0 24px var(--glow)}
        .provider-item .provider-dot{width:10px;height:10px;border-radius:50%;flex-shrink:0}
        .provider-item .provider-info{flex:1;min-width:0}
        .provider-item .provider-name{font-weight:600;font-size:.9em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
        .provider-item .provider-model{font-size:.72em;color:var(--text2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
        .provider-item .provider-actions{display:flex;gap:4px;opacity:0;transition:var(--transition)}
        .provider-item:hover .provider-actions{opacity:1}
        .chat-list-item{padding:9px 12px;border-radius:var(--radius-xs);cursor:pointer;font-size:.82em;transition:var(--transition);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--text2);border:1px solid transparent}
        .chat-list-item:hover{background:var(--surface2);color:var(--text)}
        .chat-list-item.active{background:var(--surface3);color:var(--text);border-color:var(--border)}
        .sidebar-footer{padding:10px 14px;border-top:1px solid var(--border);font-size:.7em;color:var(--text2);text-align:center}
        .main-area{flex:1;display:flex;flex-direction:column;min-width:0;position:relative}
        .main-header{padding:12px 20px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:12px;background:var(--surface);z-index:5;flex-shrink:0}
        .main-header .current-provider{font-weight:600;font-size:.95em}
        .main-header .current-model{font-size:.75em;color:var(--text2)}
        .main-header .header-actions{margin-left:auto;display:flex;gap:8px;align-items:center}
        .chat-messages{flex:1;overflow-y:auto;padding:20px 24px;display:flex;flex-direction:column;gap:16px;scroll-behavior:smooth}
        .chat-messages::-webkit-scrollbar{width:6px}
        .chat-messages::-webkit-scrollbar-thumb{background:var(--border);border-radius:6px}
        .message{display:flex;gap:12px;max-width:85%;animation:msgIn .35s ease-out}
        @keyframes msgIn{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}
        .message.user{align-self:flex-end;flex-direction:row-reverse}
        .message.assistant{align-self:flex-start}
        .message-avatar{width:36px;height:36px;border-radius:50%;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-weight:700;border:2px solid var(--border)}
        .message.user .message-avatar{background:var(--accent);border-color:var(--accent);color:#fff}
        .message.assistant .message-avatar{background:var(--surface3);border-color:var(--accent3);color:var(--accent3)}
        .message-content{background:var(--surface2);padding:14px 18px;border-radius:var(--radius);line-height:1.55;font-size:.9em;word-break:break-word;position:relative;border:1px solid var(--border)}
        .message.user .message-content{background:var(--accent);border-color:var(--accent);color:#fff;border-bottom-right-radius:4px}
        .message.assistant .message-content{border-bottom-left-radius:4px;border-color:#2a2a44}
        body.light-mode .message.assistant .message-content{border-color:#c0c0d0}
        .message-content pre{background:#0d0d1a;border-radius:var(--radius-xs);padding:14px 16px;overflow-x:auto;font-family:var(--mono);font-size:.82em;border:1px solid var(--border);position:relative;margin:10px 0}
        body.light-mode .message-content pre{background:#e8e8f0;color:#1a1a2e}
        .message-content code{font-family:var(--mono);font-size:.88em;background:#1a1a3033;padding:2px 6px;border-radius:3px}
        body.light-mode .message-content code{background:#d0d0e033}
        .message-content pre code{background:0 0;padding:0;font-size:.82em}
        .copy-code-btn{position:absolute;top:8px;right:10px;background:var(--surface3);border:1px solid var(--border);color:var(--text2);cursor:pointer;font-size:.7em;padding:4px 8px;border-radius:4px;transition:var(--transition);opacity:0}
        .message-content pre:hover .copy-code-btn{opacity:1}
        .copy-code-btn:hover{color:#fff;border-color:var(--accent)}
        .message-actions{display:flex;gap:6px;margin-top:6px;opacity:0;transition:var(--transition)}
        .message:hover .message-actions{opacity:1}
        .message-actions button{font-size:.7em;padding:4px 8px;border-radius:4px;border:1px solid var(--border);background:var(--surface2);color:var(--text2);cursor:pointer;transition:var(--transition)}
        .message-actions button:hover{background:var(--surface3);color:#fff}
        .thinking-block{background:#1a1a30;border-left:3px solid var(--accent3);padding:10px 14px;border-radius:0 var(--radius-xs) var(--radius-xs) 0;margin:8px 0;font-size:.82em;color:#b0b0d0;font-style:italic}
        body.light-mode .thinking-block{background:#e0e0f0;color:#3a3a5a}
        .thinking-block summary{cursor:pointer;font-weight:600;color:var(--accent3);font-style:normal;user-select:none}
        .input-area{padding:14px 20px;border-top:1px solid var(--border);background:var(--surface);display:flex;gap:10px;align-items:flex-end;flex-shrink:0;z-index:5}
        .input-area textarea{flex:1;resize:none;border-radius:var(--radius-sm);border:1px solid var(--border);background:var(--surface2);color:var(--text);padding:12px 16px;font-family:var(--font);font-size:.9em;line-height:1.5;min-height:46px;max-height:200px;outline:0;transition:var(--transition)}
        .input-area textarea:focus{border-color:var(--accent);box-shadow:0 0 20px var(--glow)}
        .input-area textarea::placeholder{color:#555}
        body.light-mode .input-area textarea::placeholder{color:#888}
        .send-btn{width:46px;height:46px;border-radius:50%;background:var(--accent);border:none;color:#fff;cursor:pointer;transition:var(--transition);flex-shrink:0;display:flex;align-items:center;justify-content:center}
        .send-btn:hover{background:#7d6ff0;box-shadow:0 0 30px var(--glow);transform:scale(1.05)}
        .send-btn:active{transform:scale(.93)}
        .send-btn:disabled{opacity:.4;cursor:not-allowed;box-shadow:none;transform:none}
        .modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:100;display:flex;align-items:center;justify-content:center;animation:fadeIn .2s ease}
        @keyframes fadeIn{from{opacity:0}to{opacity:1}}
        .modal{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:28px;width:90%;max-width:620px;max-height:85vh;overflow-y:auto;box-shadow:var(--shadow);animation:modalSlide .3s ease}
        @keyframes modalSlide{from{transform:translateY(30px);opacity:0}to{transform:translateY(0);opacity:1}}
        .modal::-webkit-scrollbar{width:5px}
        .modal::-webkit-scrollbar-thumb{background:var(--border);border-radius:5px}
        .modal h2{margin-bottom:20px;font-size:1.3em;background:linear-gradient(135deg,var(--accent2),var(--accent3));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
        .modal label{display:block;font-size:.82em;font-weight:600;margin-bottom:4px;color:var(--text2);text-transform:uppercase;letter-spacing:.5px}
        .modal input,.modal select,.modal textarea{width:100%;padding:10px 14px;border-radius:var(--radius-xs);border:1px solid var(--border);background:var(--surface2);color:var(--text);font-family:var(--font);font-size:.9em;outline:0;transition:var(--transition);margin-bottom:14px}
        .modal input:focus,.modal select:focus,.modal textarea:focus{border-color:var(--accent);box-shadow:0 0 14px var(--glow)}
        .modal select option{background:var(--surface2);color:var(--text)}
        .modal .form-row{display:flex;gap:12px}
        .modal .form-row>*{flex:1}
        .modal .form-actions{display:flex;gap:10px;justify-content:flex-end;margin-top:10px}
        .toggle-switch{display:flex;align-items:center;gap:10px;cursor:pointer;user-select:none;margin-bottom:14px}
        .toggle-switch input{display:none}
        .toggle-slider{width:46px;height:26px;border-radius:13px;background:var(--surface3);border:1px solid var(--border);position:relative;transition:var(--transition);flex-shrink:0}
        .toggle-slider::after{content:'';position:absolute;width:20px;height:20px;border-radius:50%;background:#fff;top:2px;left:2px;transition:var(--transition)}
        .toggle-switch input:checked+.toggle-slider{background:var(--accent);border-color:var(--accent)}
        .toggle-switch input:checked+.toggle-slider::after{left:22px}
        .preset-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:14px}
        .preset-card{padding:12px 14px;border-radius:var(--radius-xs);border:1px solid var(--border);cursor:pointer;transition:var(--transition);background:var(--surface2);text-align:center;font-size:.85em;font-weight:500}
        .preset-card:hover{border-color:var(--accent);background:var(--surface3);box-shadow:0 0 18px var(--glow)}
        .preset-card .preset-icon{width:36px;height:36px;margin:0 auto 6px}
        .preset-card .preset-icon svg{width:100%;height:100%}
        .toast-container{position:fixed;top:20px;right:20px;z-index:200;display:flex;flex-direction:column;gap:8px}
        .toast{padding:12px 20px;border-radius:var(--radius-xs);background:var(--surface3);border:1px solid var(--border);color:var(--text);font-size:.85em;animation:toastIn .3s ease,toastOut .3s ease 2.5s forwards;box-shadow:var(--shadow);max-width:350px}
        @keyframes toastIn{from{transform:translateX(120%);opacity:0}to{transform:translateX(0);opacity:1}}
        @keyframes toastOut{from{transform:translateX(0);opacity:1}to{transform:translateX(120%);opacity:0}}
        .empty-state{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;color:var(--text2);text-align:center;padding:40px;gap:12px}
        .empty-state .empty-icon{width:80px;height:80px;opacity:.5}
        .empty-state .empty-icon svg{width:100%;height:100%;stroke:var(--accent3)}
        .empty-state h3{font-weight:600;color:var(--text)}
        @media (max-width:768px){.sidebar{position:fixed;left:0;top:0;bottom:0;z-index:50;width:280px;min-width:280px;box-shadow:var(--shadow)}.sidebar.collapsed{left:-290px;width:280px;min-width:280px}.message{max-width:92%}.modal{width:95%;padding:18px;max-height:90vh}.preset-grid{grid-template-columns:1fr}.modal .form-row{flex-direction:column;gap:0}}
        .icon-svg{fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
        #installBtn{display:none}
        #installBtn.visible{display:inline-flex}
        .attachment-area{display:flex;gap:8px;padding:0 20px 8px;flex-wrap:wrap;flex-shrink:0}
        .attachment-chip{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;background:var(--surface2);border:1px solid var(--border);border-radius:20px;font-size:.78em;color:var(--text);transition:var(--transition);max-width:200px}
        .attachment-chip:hover{border-color:var(--accent);background:var(--surface3)}
        .attachment-chip .file-icon{width:18px;height:18px;flex-shrink:0;color:var(--accent3)}
        .attachment-chip .file-name{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
        .attachment-chip .remove-file{cursor:pointer;width:18px;height:18px;border-radius:50%;border:none;background:var(--surface3);color:var(--text2);display:flex;align-items:center;justify-content:center;font-size:12px;flex-shrink:0;transition:var(--transition)}
        .attachment-chip .remove-file:hover{background:var(--danger);color:#fff}
        .attach-btn{width:38px;height:38px;border-radius:50%;background:var(--surface2);border:1px dashed var(--border);color:var(--text2);cursor:pointer;transition:var(--transition);flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:1.2em}
        .attach-btn:hover{border-color:var(--accent);color:var(--accent);background:var(--surface3)}
        .attach-btn:disabled{opacity:.4;cursor:not-allowed}
        .hidden-file-input{display:none}
        .message-content .attachment-ref{display:inline-block;background:var(--surface3);border:1px solid var(--border);border-radius:6px;padding:4px 8px;margin:2px 4px;font-size:.82em;color:var(--accent3)}
    </style>
</head>
<body>
    <div class="bg-orbs">
        <div class="bg-orb"></div>
        <div class="bg-orb"></div>
        <div class="bg-orb"></div>
    </div>
    <div class="grid-overlay"></div>
    <div class="app-container">
        <aside class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <span class="logo">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none">
                        <defs><linearGradient id="logo-gradient" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="var(--accent2)"/><stop offset="100%" stop-color="var(--accent3)"/></linearGradient></defs>
                        <path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z" stroke="url(#logo-gradient)" stroke-width="2" stroke-linejoin="round"/>
                    </svg>
                    <span data-i18n="app-title">Giraffe AI</span>
                </span>
                <button class="btn-icon toggle-sidebar-btn" onclick="toggleSidebar()" title="Collapse sidebar">
                    <svg width="16" height="16" viewBox="0 0 24 24" class="icon-svg"><polyline points="15 18 9 12 15 6"/></svg>
                </button>
            </div>
            <div class="sidebar-content" id="sidebarContent">
                <button class="btn btn-accent" style="width:100%" onclick="newChat()">
                    <svg width="16" height="16" viewBox="0 0 24 24" class="icon-svg" stroke="currentColor"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="16"/><line x1="8" y1="12" x2="16" y2="12"/></svg>
                    <span data-i18n="new-chat">New Chat</span>
                </button>
                <div style="font-size:.7em;text-transform:uppercase;letter-spacing:1px;color:var(--text2);margin-top:8px;padding:0 4px" data-i18n="providers-heading">Providers</div>
                <div id="providerList"></div>
                <button class="btn" style="width:100%;margin-top:4px;border-style:dashed" onclick="openProviderModal()">
                    <svg width="16" height="16" viewBox="0 0 24 24" class="icon-svg"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
                    <span data-i18n="add-provider">Add Provider</span>
                </button>
                <div style="font-size:.7em;text-transform:uppercase;letter-spacing:1px;color:var(--text2);margin-top:12px;padding:0 4px" data-i18n="chat-history-heading">Chat History</div>
                <div id="chatHistoryList"></div>
                <div class="sidebar-mascot">
