name: Build Microsoft Store MSIX

# Store-ONLY workflow. It never creates a GitHub release and never touches the archives: it takes
# the win-x64 archive that the normal release already published and wraps it in the MSIX the
# Microsoft Store needs (Microsoft re-signs MSIX, so no code-signing certificate is required).
#
# Why a separate workflow instead of the store-msix job inside release.yml: that job is gated on
# do_release == 'true', so producing a Store package would otherwise force a full GitHub release.
# This one is dispatched by hand against an existing release tag.
#
# Requires the Partner Center identity secrets (STORE_IDENTITY_NAME, STORE_PUBLISHER) - see
# docs-dev/STORE-PUBLISHING.md section 8b.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version to package (e.g. 1.26.09.11). 'latest' = newest GitHub release."
        required: false
        default: latest

permissions:
  contents: read

concurrency:
  group: store-msix
  cancel-in-progress: false

jobs:
  store-msix:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: AgentBridge

      - name: Resolve the release tag
        id: tag
        shell: bash
        run: |
          V="${{ github.event.inputs.version }}"
          V="$(printf '%s' "$V" | tr -d ' ')"
          if [ -z "$V" ] || [ "$V" = "latest" ]; then
            # /releases/latest redirect - no API call, no rate limit.
            V=$(curl -fsSL -o /dev/null -w '%{url_effective}' \
                  "https://github.com/Graphene-Lab/AgentBridge/releases/latest" \
                | grep -oE 'v[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+$' || true)
          fi
          V="${V#v}"
          if ! printf '%s' "$V" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::cannot resolve a release version from '${{ github.event.inputs.version }}'"
            exit 1
          fi
          echo "Packaging release v$V"
          echo "version=$V" >> "$GITHUB_OUTPUT"

      - name: Download the win-x64 archive of that release
        shell: bash
        run: |
          URL="https://github.com/Graphene-Lab/AgentBridge/releases/download/v${{ steps.tag.outputs.version }}/agentbridge-win-x64.tar.gz"
          # curl streams to disk; Invoke-WebRequest would buffer the whole 1.4 GB in memory.
          curl -fL --retry 3 -o win-x64.tar.gz "$URL"
          ls -lh win-x64.tar.gz

      - name: Extract win-x64 payload
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path payload | Out-Null
          tar -xzf win-x64.tar.gz -C payload
          if (-not (Test-Path payload/agent.exe)) { throw 'payload has no agent.exe' }

      - name: Add MSBuild to PATH
        uses: microsoft/setup-msbuild@v2

      - name: Compile PSF (x64 Release) instead of taking it from NuGet
        shell: pwsh
        run: |
          # Why from source: Microsoft ties PSF telemetry collection to the binaries taken from the
          # NuGet package -- those are built with Microsoft's real telemetry provider GUID injected
          # into include/Telemetry.h (see psf-public-nuget-build.yml in the PSF repo). Building from
          # the repo leaves that provider id as the zeroed placeholder, so the packaged app has
          # nowhere to send telemetry. There is no runtime switch for it: PsfRuntime reads only
          # 'fixups' from config.json.
          #
          # Only the two projects the package actually needs are built, NOT CentennialFixups.sln:
          # the solution also builds RegLegacyFixups64, which fails to link on the current runner
          # (LNK2019 on WINRT_IMPL_RoGetActivationFactory / WINRT_IMPL_RoOriginateLanguageException,
          # run 34662147652) and that failure is unrelated to anything we ship. PsfLauncher carries
          # PsfRuntime through its ProjectReference, so two invocations cover all three binaries.
          $ErrorActionPreference = 'Continue'
          $psfTag = '1.0.240212.1'
          git clone --depth 1 --branch $psfTag `
            https://github.com/microsoft/MSIX-PackageSupportFramework.git psf-src
          if ($LASTEXITCODE -ne 0) { throw 'PSF clone failed' }

          foreach ($proj in 'PsfLauncher\PsfLauncher.vcxproj',
                           'fixups\FileRedirectionFixup\FileRedirectionFixup.vcxproj') {
            # The projects pin the VS2019 toolset (v142); windows-latest ships v143.
            msbuild "psf-src\$proj" -p:Configuration=Release -p:Platform=x64 `
              -p:PlatformToolset=v143 -m /v:minimal
            if ($LASTEXITCODE -ne 0) { throw "PSF build failed for $proj (exit $LASTEXITCODE)" }
          }

          New-Item -ItemType Directory -Force -Path psf-bin | Out-Null
          foreach ($f in 'PsfLauncher64.exe','PsfRuntime64.dll','FileRedirectionFixup64.dll') {
            $src = Get-ChildItem -Path psf-src -Recurse -Filter $f -ErrorAction SilentlyContinue |
                   Where-Object { $_.FullName -match '\\x64\\Release\\' } |
                   Select-Object -First 1
            if (-not $src) { throw "PSF build did not produce $f" }
            Copy-Item $src.FullName psf-bin\ -Force
            Write-Host "  $f  <-  $src"
          }
          Write-Host 'PSF built from source into psf-bin (no Microsoft telemetry provider id)'

      - name: Build MSIX
        shell: pwsh
        env:
          VERSION: ${{ steps.tag.outputs.version }}
          STORE_IDENTITY_NAME: ${{ secrets.STORE_IDENTITY_NAME }}
          STORE_PUBLISHER: ${{ secrets.STORE_PUBLISHER }}
        run: |
          if (-not $env:STORE_IDENTITY_NAME -or -not $env:STORE_PUBLISHER) {
            throw 'STORE_IDENTITY_NAME / STORE_PUBLISHER are not set - the package would carry a placeholder identity and Partner Center would reject it.'
          }
          $msixArgs = @{}
          if (-not (Test-Path "$env:GITHUB_WORKSPACE/psf-bin/PsfLauncher64.exe")) {
            throw 'psf-bin is missing - the from-source PSF build did not run. Refusing to package with the NuGet binaries, which carry Microsoft''s telemetry provider id.'
          }
          $msixArgs.PsfBinDir = "$env:GITHUB_WORKSPACE/psf-bin"
          # The guard above only proves the secrets exist; without these two lines the script silently
          # falls back to its own placeholder defaults (Name=GrapheneLab.AgentBridge,
          # Publisher=CN=Graphene Lab, O=Graphene Lab, C=IT) and the package is not submittable.
          $msixArgs.IdentityName = $env:STORE_IDENTITY_NAME
          $msixArgs.Publisher = $env:STORE_PUBLISHER
          # Not a secret: it is the public publisher display name of this Partner Center account.
          # The Store rejects the package unless the manifest value matches it exactly (hyphen included).
          $msixArgs.PublisherDisplayName = 'Graphene-Lab'
          Write-Host "Packaging with identity Name=$($env:STORE_IDENTITY_NAME) Publisher=$($env:STORE_PUBLISHER) PublisherDisplayName=Graphene-Lab"
          & "$env:GITHUB_WORKSPACE/AgentBridge/tools/store/New-StoreMsix.ps1" `
            -PayloadDir "$env:GITHUB_WORKSPACE/payload" `
            -Version $env:VERSION `
            -OutDir "$env:GITHUB_WORKSPACE/store-msix" `
            @msixArgs

      - name: Verify the packed manifest really carries the Store identity
        shell: pwsh
        env:
          STORE_IDENTITY_NAME: ${{ secrets.STORE_IDENTITY_NAME }}
          STORE_PUBLISHER: ${{ secrets.STORE_PUBLISHER }}
        run: |
          # Read AppxManifest.xml straight out of the package (an MSIX is a ZIP container) instead of
          # trusting that the parameters landed. This step exists because run 34662632951 packed the
          # placeholder identity while the guard above reported everything as set.
          $msix = Get-ChildItem "$env:GITHUB_WORKSPACE/store-msix" -Filter *.msix | Select-Object -First 1
          if (-not $msix) { throw 'no .msix produced' }
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $zip = [System.IO.Compression.ZipFile]::OpenRead($msix.FullName)
          try {
            $entry = $zip.Entries | Where-Object { $_.FullName -eq 'AppxManifest.xml' }
            if (-not $entry) { throw 'package has no AppxManifest.xml' }
            $xml = (New-Object System.IO.StreamReader($entry.Open())).ReadToEnd()
          } finally { $zip.Dispose() }

          if ($xml -notmatch [regex]::Escape('Name="' + $env:STORE_IDENTITY_NAME + '"')) {
            Write-Host $xml
            throw "packed manifest Identity Name is NOT '$($env:STORE_IDENTITY_NAME)'"
          }
          if ($xml -notmatch [regex]::Escape('Publisher="' + $env:STORE_PUBLISHER + '"')) {
            Write-Host $xml
            throw "packed manifest Publisher is NOT '$($env:STORE_PUBLISHER)'"
          }
          # The Store rejects the package outright if this differs from the account's publisher
          # display name, hyphen included (seen 2026-09-12 on submission 1152921505701874924).
          if ($xml -notmatch '<PublisherDisplayName>Graphene-Lab</PublisherDisplayName>') {
            Write-Host $xml
            throw 'packed manifest PublisherDisplayName is NOT Graphene-Lab'
          }
          # Properties/DisplayName must equal the reserved Store product name (with a space).
          # Partner Center rejected the previous package: "usa un nome visualizzato che non hai
          # riservato: Graphene AgentBridge" (submission 1152921505701874924, 2026-09-12).
          if ($xml -notmatch '<DisplayName>Graphene Agent Bridge</DisplayName>') {
            Write-Host $xml
            throw 'packed manifest Properties DisplayName is NOT "Graphene Agent Bridge"'
          }
          Write-Host "Verified: packed manifest carries the reserved Store identity ($($msix.Length) bytes)"

      - name: Upload MSIX
        uses: actions/upload-artifact@v4
        with:
          name: store-msix-${{ steps.tag.outputs.version }}
          path: store-msix/*.msix
          if-no-files-found: error
