name: Build and Release AgentBridge

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.rid }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            rid: win-x64
            ext: .exe
          - os: ubuntu-latest
            rid: linux-x64
            ext: ''
          # No linux-arm64: KokoroSharp 0.6.7 ships no espeak-ng-linux-arm64
          # binary, so TTS would be broken on ARM64 Linux.
          - os: macos-latest
            rid: osx-x64
            ext: ''
          - os: macos-latest
            rid: osx-arm64
            ext: ''
    steps:
      # AgentBridge references sibling projects (..\AIOrchestrator\ etc.), so the
      # CI must check out the whole dependency tree in the same relative layout.
      - name: Checkout AgentBridge
        uses: actions/checkout@v4
        with:
          path: AgentBridge
      - name: Checkout AIOrchestrator
        uses: actions/checkout@v4
        with:
          repository: Graphene-Lab/AIOrchestrator
          path: AIOrchestrator
      - name: Checkout AllToMarkdown
        uses: actions/checkout@v4
        with:
          repository: Andrea-Bruno/AllToMarkdown
          path: AllToMarkdown
      - name: Checkout MermaidRendering
        uses: actions/checkout@v4
        with:
          repository: Graphene-Lab/MermaidRendering
          path: MermaidRendering
      - name: Checkout ReverseMarkdown
        uses: actions/checkout@v4
        with:
          repository: Graphene-Lab/ReverseMarkdown
          path: ReverseMarkdown
      - name: Checkout UISupportGeneric
        uses: actions/checkout@v4
        with:
          repository: Graphene-Lab/UISupportGeneric
          path: UISupportGeneric

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Publish
        shell: bash
        run: |
          dotnet publish AgentBridge/AgentBridge.csproj -c Release -r ${{ matrix.rid }} \
            --self-contained true \
            -p:PublishSingleFile=true \
            -p:IncludeNativeLibrariesForSelfExtract=true \
            -p:DebugType=None -p:DebugSymbols=false \
            -o ./publish

      # The archive deliberately ships kokoro.onnx (325 MB) plus the KokoroSharp
      # voices/ and espeak-ng-data/ content: single-file publish bundles managed
      # code only, and the TTS endpoints need those assets next to the exe.
      # chmod: on Linux/macOS the espeak-ng binaries must stay executable inside
      # the tarball (NuGet extraction does not preserve exec bits).
      - name: Package
        shell: bash
        run: |
          chmod +x publish/espeak/espeak-ng-*.dll
          cd publish
          tar -czf ../agentbridge-${{ matrix.rid }}.tar.gz .
          cd ..
          ls -lh agentbridge-${{ matrix.rid }}.tar.gz

      - name: Attach to Release
        uses: softprops/action-gh-release@v2
        with:
          files: agentbridge-${{ matrix.rid }}.tar.gz
