name: Feature request
description: Suggest an idea for AgentBridge
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for suggesting an improvement. Describe the problem you are
        solving, not just the feature itself.
  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
      description: The workflow or pain point behind the request
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: What should AgentBridge do differently?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you considered
      description: Workarounds or other approaches that did not fully work
