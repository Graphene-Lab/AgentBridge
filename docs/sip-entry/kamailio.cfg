# /etc/kamailio/kamailio.cfg Ã¢â‚¬â€ minimal SIP entry point (A <-> B <-> C).
#
# Architecture: AgentBridge (A, behind NAT) and the smartphone (C, mobile) are both
# SIP *clients* of this server (B). A REGISTERs here (outbound Ã¢â‚¬â€ no inbound ports
# needed at A), C dials sip:agent@<this-host>, inbound calls are routed to A's
# registration and media is force-relayed by rtpengine (userspace: payloads pass
# through untouched, no codec handling). See AgentBridge docs/sip.md.
#
# Placeholders __PUBLIC_IP__ / __HA1__ are substituted by setup-entrypoint.sh.
# HA1 = md5("agent:<PUBLIC_IP>:<shared-secret>")

debug=3
log_stderror=no
log_facility=LOG_LOCAL0
fork=yes
children=2

# advertise on the listen directive (not the deprecated advertised_address): Via, Contact and
# record_route() must carry the public IP, never the 0.0.0.0 bind address.
listen=udp:0.0.0.0:__PORT__ advertise __PUBLIC_IP__:__PORT__
alias=__PUBLIC_IP__

mpath="/usr/lib/x86_64-linux-gnu/kamailio/modules/"

loadmodule "tm.so"
loadmodule "sl.so"
loadmodule "rr.so"
loadmodule "pv.so"
loadmodule "maxfwd.so"
loadmodule "textops.so"
loadmodule "siputils.so"
loadmodule "xlog.so"
loadmodule "usrloc.so"
loadmodule "registrar.so"
loadmodule "auth.so"
loadmodule "nathelper.so"
loadmodule "rtpengine.so"
loadmodule "ctl.so"

modparam("usrloc", "db_mode", 0)
modparam("usrloc", "nat_bflag", 6)
modparam("ctl", "binrpc", "unix:/run/kamailio/kamailio.sock")   # kamcmd usrloc.dump etc.
# NAT registration: nathelper's fix_nated_register stores the source address in the
# received AVP, registrar reads the same AVP to route replies back through the NAT.
modparam("nathelper", "received_avp", "$avp(received)")
modparam("registrar", "received_avp", "$avp(received)")
modparam("rtpengine", "rtpengine_sock", "udp:127.0.0.1:2223")

request_route {
    if (is_method("REGISTER")) {
        # The AgentBridge AOR ("__USER__") requires the shared credential (HA1 digest).
        if ($rU == "__USER__" || $tU == "__USER__") {
            $var(realm) = "__PUBLIC_IP__";
            $var(ha1) = "__HA1__";
            $var(ar) = pv_auth_check("$var(realm)", "$var(ha1)", "1", "1");
            if ($var(ar) == -5) {
                www_challenge("$var(realm)", "0");   # no credentials yet Ã¢â€ â€™ 401, client retries with digest
                exit;
            }
            if ($var(ar) != 1) {
                sl_send_reply("403", "Forbidden");
                exit;
            }
            fix_nated_register();
            if (!save("location")) sl_reply_error();
            exit;
        }
        # Any other user (softphone): acknowledged but NOT stored Ã¢â‚¬â€ calls are always routed
        # to the "agent" AOR, so an unauthenticated registration can never hijack it. The
        # softphone still needs a non-empty password in its account config.
        sl_send_reply("200", "OK");
        exit;
    }

    # DTMF INFO (RFC 2976): forward straight to the AgentBridge registration. Some clients
    # build an incomplete Route set and loose_route would consume it leaving an empty next hop
    # (404). The PIN gate is the real security, so INFO targeting the agent AOR is never
    # rejected on routing grounds.
    if (is_method("INFO") && ($rU == "__USER__" || $tU == "__USER__")) {
        if (!lookup("location")) { sl_send_reply("404", "Not Found"); exit; }
        if (!t_relay()) sl_reply_error();
        exit;
    }

    if (!has_totag()) {
        record_route();
    } else if (!loose_route()) {
        sl_send_reply("404", "Not Here");
        exit;
    }

    if (is_method("INVITE")) {
        # Media behind NAT: rtpengine's endpoint learning resolves the real NAT-mapped
        # addresses from the first RTP packets, so the SDPs (private addresses) are left
        # untouched. NOTE: fix_nated_sdp() in Kamailio 5.6 needs specific flags and only
        # rewrites on the offer — empirically it did nothing for our NAT'd legs, and with
        # rtpengine endpoint-learning=off media died. Keep learning ON and skip the rewrite.
        if (!rtpengine_offer("relay")) xlog("L_ERR", "rtpengine offer failed\n");
    }
    if (!lookup("location")) {
        sl_send_reply("404", "Not Found");
        exit;
    }
    if (!t_relay()) sl_reply_error();
}

onreply_route {
    if (is_method("INVITE") && has_totag()) {
        if (!rtpengine_answer("relay")) xlog("L_ERR", "rtpengine answer failed\n");
    }
}
