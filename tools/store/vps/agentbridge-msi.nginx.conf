# AgentBridge Store MSI — stable non-redirecting URL for Microsoft Partner Center.
# Include inside the aitechnology.it :443 server block (after the server_name line):
#     include /etc/nginx/snippets/agentbridge-msi.conf;
# The exact URL answered by this location is https://aitechnology.it/agentbridge/msi
location = /agentbridge/msi {
    proxy_pass http://127.0.0.1:8686/;
    proxy_http_version 1.0;
    proxy_buffering off;
    proxy_request_buffering off;
    proxy_set_header Host $host;
    proxy_read_timeout 900s;
    proxy_send_timeout 900s;
}
