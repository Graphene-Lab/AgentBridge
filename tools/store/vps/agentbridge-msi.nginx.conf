# AgentBridge Store MSI — stable non-redirecting URLs for Microsoft Partner Center.
# Include inside the aitechnology.it :443 server block (after the server_name line):
#     include /etc/nginx/snippets/agentbridge-msi.conf;
#
#   https://aitechnology.it/agentbridge/msi/<version>  pinned to release tag v<version>
#   https://aitechnology.it/agentbridge/msi            latest release (manual use only)
#
# Store submissions use the VERSIONED url: the binary behind it must not change
# (Partner Center policy 10.2.9), while /agentbridge/msi follows every release.
location = /agentbridge/msi {
    proxy_pass http://127.0.0.1:8686/msi;
    proxy_http_version 1.0;
    proxy_buffering off;
    proxy_request_buffering off;
    proxy_set_header Host $host;
    proxy_read_timeout 900s;
    proxy_send_timeout 900s;
}

location /agentbridge/msi/ {
    proxy_pass http://127.0.0.1:8686/msi/;
    proxy_http_version 1.0;
    proxy_buffering off;
    proxy_request_buffering off;
    proxy_set_header Host $host;
    proxy_read_timeout 900s;
    proxy_send_timeout 900s;
}
